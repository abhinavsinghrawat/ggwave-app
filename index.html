<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ggwave Acoustic App</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://ggwave.ggerganov.com/ggwave.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 480px; margin: 0 auto; }
        button, input { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; box-sizing: border-box; }
        .card { border: 1px solid #ddd; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
        #output { font-weight: bold; color: #007bff; word-break: break-all; }
    </style>
</head>
<body>

    <h2>ggwave Near-Ultrasonic Demo</h2>

    <div class="card">
        <h3>1. Send Message</h3>
        <input type="text" id="txText" value="Hello 123" placeholder="Enter message">
        <button onclick="sendMessage()">🔊 Send Sound</button>
    </div>

    <div class="card">
        <h3>2. Receive Message</h3>
        <button onclick="initReceiver()">🎙️ Start Listening</button>
        <p>Received: <span id="output">Waiting...</span></p>
    </div>

    <script>
        let ggwaveInstance = null;
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
            }
            return audioCtx;
        }

        async function sendMessage() {
            const ctx = getAudioContext();
            if (!ggwaveInstance) ggwaveInstance = await ggwaveFactory();

            const text = document.getElementById('txText').value;
            if (!text) return;

            const protocolId = 2; // Near-Ultrasonic Fast (~18-20 kHz)
            const waveform = ggwaveInstance.encode(text, protocolId, 10);

            const buf = ctx.createBuffer(1, waveform.length, ctx.sampleRate);
            buf.getChannelData(0).set(waveform);
            
            const source = ctx.createBufferSource();
            source.buffer = buf;
            source.connect(ctx.destination);
            source.start();
        }

        async function initReceiver() {
            const ctx = getAudioContext();
            if (!ggwaveInstance) ggwaveInstance = await ggwaveFactory();

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = ctx.createMediaStreamSource(stream);
                const processor = ctx.createScriptProcessor(1024, 1, 1);

                const instance = ggwaveInstance.init({ sampleRate: ctx.sampleRate });

                processor.onaudioprocess = (e) => {
                    const inputData = e.inputBuffer.getChannelData(0);
                    const res = ggwaveInstance.decode(instance, inputData);
                    if (res && res.length > 0) {
                        const decodedText = new TextDecoder().decode(res);
                        document.getElementById('output').innerText = decodedText;
                    }
                };

                source.connect(processor);
                processor.connect(ctx.destination);
                document.getElementById('output').innerText = "Listening for ultrasonic signals...";
            } catch (err) {
                alert("Microphone permission required: " + err.message);
            }
        }
    </script>
</body>
</html>
